# VirtualHost de AppSalon: solo public/ queda expuesto a internet.
# config/, models/, controllers/, database/ y docs/ (correos con datos de clientes) quedan fuera del DocumentRoot.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Detrás de Caddy (HTTPS) el proxy envía X-Forwarded-Proto: se expone a PHP como HTTPS=on
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

ServerTokens Prod
ServerSignature Off
