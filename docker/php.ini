; Ajustes de PHP para AppSalon (se cargan después de php.ini-production)
date.timezone = America/Bogota
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr        ; los errores salen en "docker compose logs app"
memory_limit = 128M
upload_max_filesize = 4M
post_max_size = 8M
session.cookie_httponly = 1
session.use_strict_mode = 1
