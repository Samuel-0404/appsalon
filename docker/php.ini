; Ajustes de PHP para AppSalon (se cargan después de php.ini-production)
date.timezone = America/Bogota
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr        ; los errores salen en "docker compose logs app"
memory_limit = 128M
upload_max_filesize = 4M
post_max_size = 8M
session.cookie_httponly = 1
session.use_strict_mode = 1

; OPcache: el código dentro de la imagen no cambia, así que no hace falta revisar timestamps.
; Si cambias código: docker compose up -d --build (se crea un contenedor nuevo con caché limpia).
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
